<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weight Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#6b7785;--line:#d9dfe5;--acc:#0f766e;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1a2129;--ink:#e6ebf0;--mute:#8b98a5;--line:#2a343e;--acc:#5eead4;--bad:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1a2129;--ink:#e6ebf0;--mute:#8b98a5;--line:#2a343e;--acc:#5eead4;--bad:#f97066;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.save{width:100%;margin-top:12px;padding:13px;background:var(--acc);color:var(--bg);font-weight:600}
.units{display:flex;gap:6px;margin-top:12px}
.units button{flex:1;padding:8px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.units button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mute)}
.goal{margin-top:14px;font-size:14px;color:var(--mute)}
.bar{height:8px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mute);text-align:center;padding:24px 0;margin:0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .d{color:var(--mute);font-size:14px}
li .w{font-weight:600;margin:0 10px 0 auto}
li .c{font-size:13px;min-width:52px;text-align:right;margin-right:8px;color:var(--mute)}
li button{background:none;color:var(--mute);font-size:20px;padding:2px 8px;line-height:1}
.foot{display:flex;gap:8px}
.foot button{flex:1;padding:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Weight tracker</h1>

<div class="card">
  <div class="row">
    <div><label for="date">Date</label><input id="date" type="date"></div>
    <div><label for="wt" id="wl">Weight (lb)</label><input id="wt" type="number" inputmode="decimal" step="0.1" placeholder="0.0"></div>
  </div>
  <button class="save" id="save">Save entry</button>
  <div class="units"><button id="ulb">lb</button><button id="ukg">kg</button></div>
</div>

<div class="card" id="statsCard"></div>
<div class="card"><svg id="chart" viewBox="0 0 400 220" role="img" aria-label="Weight over time"></svg></div>
<div class="card"><ul id="list"></ul></div>
<div class="foot"><button id="goalBtn">Set goal weight</button><button id="csv">Export CSV</button></div>
</main>

<script>
(function(){
  var KEY="weightTracker.v1";
  var S={unit:"lb",goal:null,entries:[]}; // entries stored in lb
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.entries))S=p;}}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var K=0.45359237;
  function show(lb){return S.unit==="kg"?lb*K:lb}
  function toLb(v){return S.unit==="kg"?v/K:v}
  function f(v){return (Math.round(v*10)/10).toFixed(1)}
  function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
  function fmt(s){var a=s.split("-");return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
  function sorted(){return S.entries.slice().sort(function(a,b){return a.d<b.d?-1:1})}

  function render(){
    $("wl").textContent="Weight ("+S.unit+")";
    $("ulb").className=S.unit==="lb"?"on":"";
    $("ukg").className=S.unit==="kg"?"on":"";
    var e=sorted(),u=S.unit;
    // stats
    var sc=$("statsCard");
    if(!e.length){sc.innerHTML='<p class="empty">No entries yet. Add your first weigh-in above.</p>';}
    else{
      var first=e[0].w,last=e[e.length-1].w,ch=show(last)-show(first);
      var h='<div class="stats"><div><b>'+f(show(first))+'</b><span>Start</span></div><div><b>'+f(show(last))+'</b><span>Current</span></div><div><b>'+(ch>0?"+":"")+f(ch)+'</b><span>Change ('+u+')</span></div></div>';
      if(S.goal){
        var g=S.goal,tot=first-g,done=first-last,left=last-g;
        var pct=tot===0?100:Math.max(0,Math.min(100,done/tot*100));
        h+='<div class="goal">Goal '+f(show(g))+' '+u+' · '+(Math.abs(left)<0.05?"reached":f(Math.abs(show(left)))+" "+u+(left>0?" to go":" past goal"))+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
      }
      sc.innerHTML=h;
    }
    // chart
    var c=$("chart"),W=400,H=220,L=40,R=14,T=14,B=28;
    if(!e.length){c.innerHTML='<text x="200" y="115" text-anchor="middle" fill="var(--mute)" font-size="14">Your chart appears here</text>';}
    else{
      var vals=e.map(function(x){return show(x.w)});
      if(S.goal)vals.push(show(S.goal));
      var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
      if(mx-mn<2){mx+=1;mn-=1}
      var pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
      var t0=new Date(e[0].d).getTime(),t1=new Date(e[e.length-1].d).getTime();
      function X(d){return e.length===1||t1===t0?(L+W-R)/2:L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R)}
      function Y(v){return T+(mx-v)/(mx-mn)*(H-T-B)}
      var s="";
      for(var i=0;i<4;i++){var v=mn+(mx-mn)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+Math.round(v)+'</text>';}
      if(S.goal){var gy=Y(show(S.goal));s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--acc)" stroke-dasharray="5 4" opacity=".7"/>';}
      var pts=e.map(function(x){return X(x.d)+","+Y(show(x.w))}).join(" ");
      if(e.length>1)s+='<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      e.forEach(function(x){s+='<circle cx="'+X(x.d)+'" cy="'+Y(show(x.w))+'" r="3.5" fill="var(--acc)"/>'});
      var a=new Date(e[0].d+"T00:00"),b=new Date(e[e.length-1].d+"T00:00"),o={month:"short",day:"numeric"};
      s+='<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--mute)">'+a.toLocaleDateString(undefined,o)+'</text>';
      if(e.length>1)s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+b.toLocaleDateString(undefined,o)+'</text>';
      c.innerHTML=s;
    }
    // list
    var li=$("list");
    if(!e.length){li.innerHTML='<li class="empty" style="display:block;border:0">Nothing logged.</li>';}
    else{
      li.innerHTML=e.slice().reverse().map(function(x,i,arr){
        var prev=arr[i+1],ch=prev?show(x.w)-show(prev.w):null;
        var col=ch===null?"":(ch>0?"color:var(--bad)":"color:var(--acc)");
        return '<li><span class="d">'+fmt(x.d)+'</span><span class="w">'+f(show(x.w))+' '+u+'</span><span class="c" style="'+col+'">'+(ch===null?"":(ch>0?"+":"")+f(ch))+'</span><button data-d="'+x.d+'" aria-label="Delete entry">×</button></li>';
      }).join("");
    }
  }

  $("date").value=today();
  $("save").onclick=function(){
    var d=$("date").value,v=parseFloat($("wt").value);
    if(!d||!(v>0)){$("wt").focus();return}
    var w=toLb(v),found=false;
    S.entries.forEach(function(x){if(x.d===d){x.w=w;found=true}});
    if(!found)S.entries.push({d:d,w:w});
    persist();$("wt").value="";render();
  };
  $("wt").addEventListener("keydown",function(ev){if(ev.key==="Enter")$("save").click()});
  $("list").onclick=function(ev){
    var d=ev.target.getAttribute&&ev.target.getAttribute("data-d");
    if(d&&confirm("Delete the entry for "+fmt(d)+"?")){S.entries=S.entries.filter(function(x){return x.d!==d});persist();render()}
  };
  $("ulb").onclick=function(){S.unit="lb";persist();render()};
  $("ukg").onclick=function(){S.unit="kg";persist();render()};
  $("goalBtn").onclick=function(){
    var cur=S.goal?f(show(S.goal)):"";
    var r=prompt("Goal weight in "+S.unit+" (leave blank to clear)",cur);
    if(r===null)return;
    var v=parseFloat(r);S.goal=v>0?toLb(v):null;persist();render();
  };
  $("csv").onclick=function(){
    var rows=["date,weight_"+S.unit].concat(sorted().map(function(x){return x.d+","+f(show(x.w))})).join("\n");
    var box=document.createElement("textarea");box.value=rows;box.style.cssText="width:100%;height:140px;margin-top:10px";
    var old=document.getElementById("csvbox");if(old)old.remove();
    box.id="csvbox";document.querySelector(".foot").after(box);box.select();
    try{document.execCommand("copy")}catch(e){}
  };
  render();
})();
</script>
</body>
</html>
